<!DOCTYPE html>
<html>
<head>
    <title>Generate Placeholder Images</title>
</head>
<body>
    <canvas id="headshot" width="400" height="500"></canvas>
    <canvas id="office" width="600" height="400"></canvas>
    <canvas id="og" width="1200" height="630"></canvas>
    
    <script>
        // Generate headshot placeholder
        const headshotCanvas = document.getElementById('headshot');
        const headshotCtx = headshotCanvas.getContext('2d');
        
        // Background
        headshotCtx.fillStyle = '#E8E8E8';
        headshotCtx.fillRect(0, 0, 400, 500);
        
        // Text
        headshotCtx.fillStyle = '#6B705C';
        headshotCtx.font = 'bold 24px Arial';
        headshotCtx.textAlign = 'center';
        headshotCtx.fillText('Professional Headshot', 200, 180);
        headshotCtx.fillText('Placeholder', 200, 210);
        
        headshotCtx.font = '16px Arial';
        headshotCtx.fillText('400x500px', 200, 250);
        headshotCtx.fillText('Hailey Gonnerman', 200, 280);
        headshotCtx.fillText('Replace with actual', 200, 320);
        headshotCtx.fillText('professional photo', 200, 340);
        
        // Generate office placeholder
        const officeCanvas = document.getElementById('office');
        const officeCtx = officeCanvas.getContext('2d');
        
        // Background
        officeCtx.fillStyle = '#E8E8E8';
        officeCtx.fillRect(0, 0, 600, 400);
        
        // Text
        officeCtx.fillStyle = '#6B705C';
        officeCtx.font = 'bold 24px Arial';
        officeCtx.textAlign = 'center';
        officeCtx.fillText('Office Photo Placeholder', 300, 180);
        
        officeCtx.font = '16px Arial';
        officeCtx.fillText('600x400px', 300, 210);
        officeCtx.fillText('Replace with actual office photo', 300, 240);
        
        // Generate OG image
        const ogCanvas = document.getElementById('og');
        const ogCtx = ogCanvas.getContext('2d');
        
        // Background
        ogCtx.fillStyle = '#6B705C';
        ogCtx.fillRect(0, 0, 1200, 630);
        
        // Accent
        ogCtx.fillStyle = '#CB997E';
        ogCtx.fillRect(0, 0, 400, 630);
        
        // Text
        ogCtx.fillStyle = 'white';
        ogCtx.font = 'bold 48px Arial';
        ogCtx.textAlign = 'left';
        ogCtx.fillText('Hailey Gonnerman', 450, 200);
        
        ogCtx.font = '32px Arial';
        ogCtx.fillText('LMFT', 450, 250);
        
        ogCtx.font = '24px Arial';
        ogCtx.fillText('Compassionate therapy for life\'s', 450, 350);
        ogCtx.fillText('transitions and everyday challenges', 450, 380);
        
        ogCtx.font = '20px Arial';
        ogCtx.fillText('Santa Clara, CA • Telehealth throughout California', 450, 450);
        
        // Download links
        document.body.innerHTML += '<h2>Right-click and "Save Image As...":</h2>';
        document.body.innerHTML += '<p><a href="' + headshotCanvas.toDataURL() + '" download="headshot.jpg">Download Headshot Placeholder</a></p>';
        document.body.innerHTML += '<p><a href="' + officeCanvas.toDataURL() + '" download="office.jpg">Download Office Placeholder</a></p>';
        document.body.innerHTML += '<p><a href="' + ogCanvas.toDataURL() + '" download="og-default.png">Download OG Image</a></p>';
    </script>
</body>
</html>
